name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install lint tooling
        run: python -m pip install ruff==0.16.0

      - name: Lint Python
        run: python -m ruff check --output-format=github .

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m py_compile deepsort.py face_registry.py vision_filters.py vision_tracking.py tests/test_face_registry.py

      - name: Validate dashboard JavaScript
        run: node --check static/dashboard.js
